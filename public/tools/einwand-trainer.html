<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HB Sales Academy – Einwand-Trainer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --bg: #0A0C13;
    --panel: #14161F;
    --panel-2: #1C1E2C;
    --line: #262B3D;
    --gold: #E8368F;
    --gold-dim: #9C3E6E;
    --white: #EDEDF4;
    --muted: #90939F;
    --green: #00E5C7;
    --red: #FF4D6D;
    --violet: #7B2FF7;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--white);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height:100%;
  }
  .wrap{
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  header{ text-align:center; padding: 10px 0 20px; }
  .logo{
    width: 200px;
    max-width: 55%;
    height:auto;
    display:block;
    margin: 0 auto 12px;
    filter: drop-shadow(0 0 22px rgba(201,161,92,0.15));
  }
  .subtitle{
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }
  .rule{
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-dim) 20%, var(--gold) 50%, var(--gold-dim) 80%, transparent);
    margin: 20px 0;
  }

  /* MODE TOGGLE */
  .mode-toggle{
    display:flex; align-items:center; gap:0;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 5px; margin-bottom: 18px; position:relative;
  }
  .mode-btn{
    flex:1; position:relative; z-index:2; background:none; border:none;
    padding: 11px 12px; font-size: 13px; font-weight:600;
    color: var(--muted); cursor:pointer; border-radius: 8px;
    transition: color .2s ease;
  }
  .mode-btn.active{ color: #fff; }
  .mode-slider{
    position:absolute; top:5px; left:5px; width:calc(50% - 5px); height:calc(100% - 10px);
    background: linear-gradient(120deg, #8B3EF7 0%, #E8368F 55%, #FF7A45 100%); border-radius: 8px;
    box-shadow: 0 4px 12px -4px rgba(232,54,143,.5);
    transition: transform .25s cubic-bezier(.4,0,.2,1); z-index:1;
  }
  .mode-toggle[data-mode="entspannt"] .mode-slider{ transform: translateX(100%); }

  /* STATS BAR */
  .statsbar{
    display:flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-chip{
    flex:1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 8px;
    text-align:center;
  }
  .stat-chip .num{ font-size: 20px; font-weight:800; }
  .stat-chip .lbl{ font-size: 10.5px; color: var(--muted); letter-spacing:.04em; text-transform:uppercase; margin-top:2px; }
  .stat-chip[data-kind="practice"] .num{ color: var(--red); }
  .stat-chip[data-kind="learned"] .num{ color: var(--green); }
  .stat-chip[data-kind="total"] .num{ color: var(--gold); }

  /* CATEGORY FILTER */
  .filters{
    display:flex;
    flex-wrap:wrap;
    gap: 8px;
    margin-bottom: 20px;
  }
  .filter-btn{
    font-size: 12px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 7px 13px;
    border-radius: 20px;
    cursor:pointer;
  }
  .filter-btn.active{
    background: linear-gradient(120deg, #8B3EF7 0%, #E8368F 55%, #FF7A45 100%);
    border-color: transparent;
    color: #fff;
    font-weight:600;
  }

  /* CARD */
  .card-area{
    min-height: 320px;
    display:flex;
    flex-direction:column;
  }
  .prompt-tag{
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .cat-badge{
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--gold);
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 10.5px;
    letter-spacing: 0.04em;
  }

  .bubble-card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--gold);
    border-radius: 14px;
    padding: 22px 20px;
    margin-bottom: 14px;
  }
  .bubble-who{
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .bubble-text{
    font-size: 18px;
    font-weight: 600;
    line-height: 1.4;
  }

  .answer-card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--green);
    border-radius: 14px;
    padding: 22px 20px;
    margin-bottom: 14px;
    display:none;
  }
  .answer-card.show{ display:block; }
  .bubble-text.answer{ font-size: 15px; font-weight: 400; color: var(--white); }
  .tip-line{
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    font-size: 12.5px;
    color: var(--gold-dim);
  }
  .tip-line b{ color: var(--gold); font-weight:600; }

  .reveal-btn{
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    border: 1px dashed var(--gold-dim);
    background: var(--panel-2);
    color: var(--gold);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 14px;
  }
  .reveal-btn:hover{ border-style: solid; }

  .rate-row{
    display:flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  .rate-btn{
    flex:1;
    padding: 14px 8px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--white);
    font-size: 13px;
    font-weight: 600;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 4px;
  }
  .rate-btn.practice{ border-color: rgba(217,97,79,0.4); color: var(--red); }
  .rate-btn.learned{ border-color: rgba(76,175,125,0.4); color: var(--green); }
  .rate-btn:active{ transform: scale(0.98); }

  .next-btn{
    width: 100%;
    padding: 15px;
    border-radius: 9px;
    border: none;
    background: linear-gradient(120deg, #8B3EF7 0%, #E8368F 55%, #FF7A45 100%);
    box-shadow: 0 4px 16px -4px rgba(232,54,143,.5);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    cursor:pointer;
    margin-top: 4px;
  }
  .next-btn:active{ transform: scale(0.98); }
  .next-btn:disabled{
    opacity: 0.35;
    cursor: default;
  }

  .empty-msg{
    text-align:center;
    color: var(--muted);
    font-size: 13.5px;
    padding: 40px 10px;
  }

  .reset-row{
    margin-top: 24px;
    text-align:center;
  }
  #resetProgress{
    background:none;
    border:none;
    color: var(--muted);
    font-size: 12px;
    cursor:pointer;
    text-decoration: underline;
  }
  #resetProgress:hover{ color: var(--white); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <img class="logo" alt="HB Sales Academy" src="/logo.svg">
    <div class="subtitle">Einwand-Trainer</div>
  </header>

  <div class="rule"></div>

  <div class="mode-toggle" id="modeToggle" data-mode="professionell">
    <div class="mode-slider"></div>
    <button class="mode-btn active" data-mode="professionell" type="button">Professionell (Sie)</button>
    <button class="mode-btn" data-mode="entspannt" type="button">Entspannt (Du)</button>
  </div>

  <div class="statsbar">
    <div class="stat-chip" data-kind="total"><div class="num" id="statTotal">0</div><div class="lbl">Geübt</div></div>
    <div class="stat-chip" data-kind="learned"><div class="num" id="statLearned">0</div><div class="lbl">Sicher</div></div>
    <div class="stat-chip" data-kind="practice"><div class="num" id="statPractice">0</div><div class="lbl">Üben</div></div>
  </div>

  <div class="filters" id="filters"></div>

  <div class="card-area" id="cardArea"></div>

  <div class="reset-row">
    <button id="resetProgress">Lernfortschritt zurücksetzen</button>
  </div>

</div>

<script>
(function(){
  // Polyfill für window.storage (localStorage-basiert, browserlokal je Gerät)
  if (!window.storage) {
    window.storage = {
      async get(key){ const v = localStorage.getItem("hb_et_"+key); return v !== null ? { key, value: v } : null; },
      async set(key, value){ localStorage.setItem("hb_et_"+key, value); return { key, value }; },
      async delete(key){ localStorage.removeItem("hb_et_"+key); return { key, deleted: true }; },
      async list(prefix){
        const keys = [];
        for (let i=0;i<localStorage.length;i++){
          const k = localStorage.key(i);
          if (k && k.startsWith("hb_et_"+(prefix||""))) keys.push(k.replace("hb_et_",""));
        }
        return { keys };
      }
    };
  }
})();
</script>
<script>
(function(){

  // Einwände aus dem Fast Page Konzept — Sie/Du, mit Kategorie und Tipp
  const OBJECTIONS = [
    { id:1, cat:"preis",
      q_pro:`„Ich bin sowieso schon gut ausgelastet, ich brauche gerade nichts Neues.“`,
      a_pro:`Das freut mich für Sie — viele wären froh, so gut ausgelastet zu sein. Darf ich fragen: ist das schon länger so, oder gerade nur saisonal viel los? Wenn's schon immer so ist: genau dann lohnt sich unser Angebot am meisten — Sie können sich dann die besten Kunden aussuchen, statt jede Anfrage anzunehmen. Wenn's saisonal ist: dann macht's erst recht Sinn, jetzt vorzusorgen, damit es auch in ruhigeren Phasen weiterläuft.`,
      q_ent:`„Bin eh voll ausgelastet, brauch grad nix Neues.“`,
      a_ent:`Cool, läuft bei dir richtig gut. Ist das schon immer so oder grad nur viel los? Wenn's immer so ist: genau dann lohnt sich unser Angebot am meisten — du kannst dir dann die besten Kunden aussuchen. Wenn's saisonal ist: dann lohnt's sich erst recht, jetzt für die ruhigeren Phasen vorzusorgen.`,
      tip:`Nie die Auslastung anzweifeln — auf Auswahl/Zukunftssicherung umlenken.` },
    { id:2, cat:"preis",
      q_pro:`„Das ist mir zu teuer.“`,
      a_pro:`Verstehe ich total. Deswegen ist das Ganze auch risikofrei aufgebaut: Sie sehen zuerst, was Sie bekommen, und entscheiden sich erst danach. Sie verlieren nichts außer ein paar Minuten Zeit.`,
      q_ent:`„Ist mir zu teuer.“`,
      a_ent:`Versteh ich. Deswegen ist's ja auch risikofrei — du siehst erst, was du bekommst, und entscheidest dich danach. Du verlierst nix außer ein paar Minuten.`,
      tip:`Preis nie verteidigen — auf das geringe Risiko des ersten Schritts zurücklenken.` },
    { id:3, cat:"skepsis",
      q_pro:`„Was ist der Haken — warum sollten Sie mir das anbieten, wenn's Ihnen am Ende nichts bringt?“`,
      a_pro:`Verständliche Frage. Der Haken ist: wir gehen in Vorleistung, weil wir überzeugt sind, dass unser Angebot überzeugt. Passt es am Ende nicht für Sie, war das unsere Zeit, nicht Ihre — genau das ist unser Anreiz, wirklich gute Arbeit abzuliefern.`,
      q_ent:`„Was ist der Haken, wieso solltest du das machen, wenn's dir nix bringt?“`,
      a_ent:`Faire Frage. Der Haken ist: wir gehen in Vorleistung, weil wir wissen, dass unser Angebot überzeugt. Passt's am Ende nicht, war's unsere Zeit, nicht deine — genau deswegen liefern wir auch wirklich gute Arbeit ab.`,
      tip:`Transparenz schlägt Rechtfertigung — das Risiko liegt bewusst bei euch, nicht beim Lead.` },
    { id:4, cat:"skepsis",
      q_pro:`„Woher haben Sie meine Nummer, wie kommen Sie auf mich?“`,
      a_pro:`Ganz einfach: ich habe recherchiert, wer in Ihrer Branche und Region aktiv ist, und Sie sind mir positiv aufgefallen. Deswegen der Anruf — bei einem bestimmten Punkt sehe ich noch Potenzial für Sie.`,
      q_ent:`„Woher hast du meine Nummer?“`,
      a_ent:`Ganz easy, hab recherchiert, wer in deiner Branche und Region aktiv ist, da bist du mir positiv aufgefallen. Deswegen der Anruf — da seh ich noch Potenzial für dich.`,
      tip:`Kurz, ehrlich, direkt zurück zum Nutzen.` },
    { id:5, cat:"skepsis",
      q_pro:`„Ich hatte schon mal eine schlechte Erfahrung mit einem ähnlichen Anbieter.“`,
      a_pro:`Das tut mir leid, das kommt leider öfter vor. Was genau ist da schiefgelaufen? Bei uns tragen Sie ohnehin kaum Risiko, weil Sie sich das Ergebnis erst ansehen, bevor Sie sich entscheiden — böse Überraschungen fallen damit weitgehend weg.`,
      q_ent:`„Hatte schon mal 'ne miese Erfahrung mit 'nem ähnlichen Anbieter.“`,
      a_ent:`Tut mir leid, hört man leider öfter. Was ist denn schiefgelaufen? Bei uns trägst du eh kaum Risiko, weil du dir das Ergebnis erst ansiehst, bevor du dich entscheidest — böse Überraschungen fallen damit weitgehend weg.`,
      tip:`Erst zuhören, dann den Unterschied zum eigenen risikoarmen Modell ziehen.` },
    { id:6, cat:"vorhanden",
      q_pro:`„Ich habe dafür schon eine Lösung.“`,
      a_pro:`Gut zu wissen — dann geht's nur noch um die Frage, ob sie wirklich noch zeitgemäß ist und das volle Potenzial ausschöpft. Genau das schauen wir uns gemeinsam an — passt eh schon alles, ändert sich für Sie nichts; wenn nicht, sehen Sie schwarz auf weiß den Unterschied.`,
      q_ent:`„Hab dafür schon was.“`,
      a_ent:`Gut zu wissen — dann geht's nur noch drum, ob's wirklich noch zeitgemäß ist und das volle Potenzial rausholt. Genau das schauen wir uns an — passt eh alles, ändert sich nix für dich, wenn nicht, siehst du den Unterschied schwarz auf weiß.`,
      tip:`Bestehende Lösung nie schlechtmachen — auf einen konkreten Vergleich verweisen.` },
    { id:7, cat:"vorhanden",
      q_pro:`„Ich habe schon jemanden, der sich darum kümmert.“`,
      a_pro:`Schön, dass Sie sich schon kümmern. Wie zufrieden sind Sie mit dem Ergebnis, merken Sie das auch am Erfolg? Ein Vergleich kostet Sie nichts, schaden kann er also nicht.`,
      q_ent:`„Hab schon wen, der sich drum kümmert.“`,
      a_ent:`Schön, kümmerst du dich schon drum. Bist du zufrieden, merkst du das am Erfolg? Ein Vergleich kostet dich nix, schaden kann er also nicht.`,
      tip:`Nie gegen bestehenden Dienstleister schießen — Ergebnis hinterfragen.` },
    { id:8, cat:"zeit",
      q_pro:`„Ich habe gerade keine Zeit.“`,
      a_pro:`Verstehe, deswegen dauert der Termin auch bewusst nur wenige Minuten, und Sie müssen sich auf gar nichts vorbereiten. Passt es Ihnen eher [Tag A] oder [Tag B]?`,
      q_ent:`„Grad keine Zeit.“`,
      a_ent:`Kein Ding, dauert eh nur ein paar Minuten, musst dich auf nix vorbereiten. Passt dir [Tag A] oder [Tag B] besser?`,
      tip:`Kürze betonen, dann direkt zurück zur Terminfrage.` },
    { id:9, cat:"zeit",
      q_pro:`„Schicken Sie mir das per E-Mail/WhatsApp.“`,
      a_pro:`Mache ich gerne zusätzlich, aber die Details zeigen sich erst richtig im gemeinsamen Gespräch — da können wir auch direkt auf Ihre Fragen eingehen. Passt Ihnen eher [Tag A] oder [Tag B] für ein paar Minuten?`,
      q_ent:`„Schick mir das per WhatsApp.“`,
      a_ent:`Mach ich dir gerne zusätzlich, aber am besten zeigt sich das live, da können wir auch gleich Fragen klären. Passt dir [Tag A] oder [Tag B]?`,
      tip:`E-Mail-Wunsch ist meist ein sanftes Nein — freundlich zurück zum Termin lenken.` },
    { id:10, cat:"zeit",
      q_pro:`„Rufen Sie mich in ein paar Wochen nochmal an.“`,
      a_pro:`Mache ich gerne — bis dahin verändert sich an Ihrer aktuellen Situation aber nichts. Wenn wir uns das jetzt kurz gemeinsam anschauen, wissen Sie wenigstens, wo Sie stehen, ganz unverbindlich.`,
      q_ent:`„Meld dich in 'n paar Wochen nochmal.“`,
      a_ent:`Mach ich, aber bis dahin ändert sich bei dir nix. Lass uns das lieber jetzt kurz anschauen, dann weißt du wenigstens, wo du stehst — ganz unverbindlich.`,
      tip:`Aufschub-Kosten benennen, dann Termin trotzdem anbieten.` },
    { id:11, cat:"zeit",
      q_pro:`„Können wir das nicht einfach gleich jetzt machen?“`,
      a_pro:`Das würde ich liebend gern, aber Ihr Angebot wird extra individuell für Sie vorbereitet — dafür brauchen wir ein kleines Zeitfenster. Passt es Ihnen daher eher [nächstmöglicher Slot] oder lieber [späterer Termin]?`,
      q_ent:`„Können wir das nicht einfach gleich jetzt machen?“`,
      a_ent:`Würd ich liebend gern, aber dein Angebot wird extra für dich vorbereitet, dafür brauchen wir ein kleines Zeitfenster. Passt dir eher [nächstmöglicher Slot] oder [späterer Termin]?`,
      tip:`Nie sofort anbieten — die 6-Stunden-Regel gilt auch bei Drängen.` },
    { id:12, cat:"entscheidung",
      q_pro:`„Ich muss das erst mit meinem Partner/meiner Partnerin besprechen.“`,
      a_pro:`Absolut nachvollziehbar. Wäre es sinnvoll, wenn er/sie beim Termin gleich mit dabei ist, damit alle Fragen direkt geklärt sind?`,
      q_ent:`„Muss ich erst mit meinem Partner besprechen.“`,
      a_ent:`Klar, macht Sinn. Wäre es einfach, wenn er/sie beim Termin mit dabei ist? Dann ist das direkt geklärt.`,
      tip:`Partner aktiv in den Termin einladen statt Einwand nur zu akzeptieren.` },
    { id:13, cat:"entscheidung",
      q_pro:`„Ich glaube nicht, dass ich sowas brauche — bei uns lief's bisher auch so gut.“`,
      a_pro:`Das ist bei vielen tatsächlich lange gut gegangen. Trotzdem merken die meisten irgendwann, dass zusätzliche Unterstützung den Unterschied macht — unser Angebot ergänzt das, was bisher funktioniert hat, es ersetzt es nicht.`,
      q_ent:`„Glaub nicht, dass ich sowas brauch, lief bisher auch so gut.“`,
      a_ent:`Ist bei vielen tatsächlich lange gut gegangen. Trotzdem merken die meisten irgendwann, dass ein bisschen Unterstützung den Unterschied macht — unser Angebot ergänzt das, was schon funktioniert, ersetzt es nicht.`,
      tip:`Bestehenden Erfolg nie kleinreden — als Ergänzung positionieren, nicht als Konkurrenz.` },
    { id:14, cat:"entscheidung",
      q_pro:`„Ich muss erst überlegen.“`,
      a_pro:`Klar, das ist keine spontane Entscheidung. Was macht Sie konkret noch unsicher — der Nutzen, der Preis, oder eher der Zeitpunkt? Dann kann ich gezielt darauf eingehen.`,
      q_ent:`„Muss ich erst überlegen.“`,
      a_ent:`Klar, keine spontane Sache. Was macht dich noch unsicher — Nutzen, Preis oder Timing? Dann reden wir gezielt darüber.`,
      tip:`'Überlegen' konkretisieren lassen, dann gezielt behandeln.` }
  ];

  const CAT_LABELS = {
    preis:"Preis & Auslastung", skepsis:"Skepsis & Vertrauen", vorhanden:"Bereits vorhanden",
    zeit:"Zeit & Aufschub", entscheidung:"Entscheidung"
  };

  const STORAGE_KEY = "objection_trainer_progress";

  // progress[id] = "learned" | "practice" | undefined (noch nicht bewertet)
  let progress = {};
  let mode = "professionell";
  let currentCat = "all";
  let currentItem = null;
  let revealed = false;

  const cardArea = document.getElementById("cardArea");
  const modeToggle = document.getElementById("modeToggle");
  const filtersEl = document.getElementById("filters");

  function buildFilters(){
    const cats = ["all", ...Object.keys(CAT_LABELS)];
    filtersEl.innerHTML = cats.map(c => {
      const label = c === "all" ? "Alle" : CAT_LABELS[c];
      return `<button class="filter-btn ${c==='all'?'active':''}" data-cat="${c}">${label}</button>`;
    }).join("");
  }

  filtersEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".filter-btn");
    if (!btn) return;
    filtersEl.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentCat = btn.dataset.cat;
    pickNext();
  });

  modeToggle.addEventListener("click", (e) => {
    const btn = e.target.closest(".mode-btn");
    if (!btn) return;
    mode = btn.dataset.mode;
    modeToggle.dataset.mode = mode;
    modeToggle.querySelectorAll(".mode-btn").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
    renderCurrent();
  });

  function pool(){
    return OBJECTIONS.filter(o => currentCat === "all" || o.cat === currentCat);
  }

  function weightOf(item){
    const status = progress[item.id];
    if (status === "practice") return 4;
    if (status === "learned") return 1;
    return 2; // noch nicht bewertet
  }

  function pickNext(){
    const items = pool();
    if (items.length === 0){
      currentItem = null;
      renderEmpty();
      return;
    }
    // gewichtete Zufallsauswahl, vermeidet direkte Wiederholung wenn möglich
    let candidates = items;
    if (items.length > 1 && currentItem){
      candidates = items.filter(i => i.id !== currentItem.id);
      if (candidates.length === 0) candidates = items;
    }
    const weights = candidates.map(weightOf);
    const totalWeight = weights.reduce((a,b)=>a+b,0);
    let r = Math.random() * totalWeight;
    let chosen = candidates[0];
    for (let i=0;i<candidates.length;i++){
      r -= weights[i];
      if (r <= 0){ chosen = candidates[i]; break; }
    }
    currentItem = chosen;
    revealed = false;
    renderCurrent();
  }

  function renderEmpty(){
    cardArea.innerHTML = `<div class="empty-msg">Keine Einwände in dieser Kategorie.</div>`;
  }

  function renderCurrent(){
    if (!currentItem){ renderEmpty(); return; }
    const q = mode === "professionell" ? currentItem.q_pro : currentItem.q_ent;
    const a = mode === "professionell" ? currentItem.a_pro : currentItem.a_ent;

    cardArea.innerHTML = `
      <div class="prompt-tag">
        <span>Kunde sagt</span>
        <span class="cat-badge">${CAT_LABELS[currentItem.cat]}</span>
      </div>
      <div class="bubble-card">
        <div class="bubble-who">Einwand</div>
        <div class="bubble-text">${q}</div>
      </div>

      <button class="reveal-btn" id="revealBtn" ${revealed ? "style='display:none;'" : ""}>Antwort aufdecken</button>

      <div class="answer-card ${revealed ? 'show' : ''}" id="answerCard">
        <div class="bubble-who">Musterantwort</div>
        <div class="bubble-text answer">${a}</div>
        <div class="tip-line"><b>Tipp:</b> ${currentItem.tip}</div>
      </div>

      <div class="rate-row" id="rateRow" style="${revealed ? '' : 'display:none;'}">
        <button class="rate-btn practice" data-rate="practice">😬 Muss ich üben</button>
        <button class="rate-btn learned" data-rate="learned">✅ Kannte ich</button>
      </div>

      <button class="next-btn" id="nextBtn" ${revealed ? "" : "disabled"}>Nächster Einwand</button>
    `;

    const revealBtn = document.getElementById("revealBtn");
    if (revealBtn){
      revealBtn.addEventListener("click", () => {
        revealed = true;
        renderCurrent();
      });
    }

    const rateRow = document.getElementById("rateRow");
    if (rateRow){
      rateRow.querySelectorAll(".rate-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          progress[currentItem.id] = btn.dataset.rate;
          persistProgress();
          renderStats();
          pickNext();
        });
      });
    }

    const nextBtn = document.getElementById("nextBtn");
    if (nextBtn && !nextBtn.disabled){
      nextBtn.addEventListener("click", pickNext);
    }
  }

  function renderStats(){
    const ids = OBJECTIONS.map(o => o.id);
    let learned = 0, practice = 0, total = 0;
    ids.forEach(id => {
      const s = progress[id];
      if (s === "learned"){ learned++; total++; }
      else if (s === "practice"){ practice++; total++; }
    });
    document.getElementById("statTotal").textContent = total;
    document.getElementById("statLearned").textContent = learned;
    document.getElementById("statPractice").textContent = practice;
  }

  async function persistProgress(){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(progress));
    }catch(err){
      console.error("Speichern fehlgeschlagen:", err);
    }
  }

  async function loadProgress(){
    try{
      const res = await window.storage.get(STORAGE_KEY);
      if (res && res.value){
        progress = JSON.parse(res.value) || {};
      }
    }catch(err){
      progress = {};
    }
    renderStats();
  }

  document.getElementById("resetProgress").addEventListener("click", async () => {
    if (!confirm("Lernfortschritt wirklich komplett zurücksetzen?")) return;
    progress = {};
    await persistProgress();
    renderStats();
    pickNext();
  });

  buildFilters();
  loadProgress().then(pickNext);

})();
</script>
</body>
</html>
